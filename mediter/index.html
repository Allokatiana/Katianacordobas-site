.lotus .halo{animation:breathe 10s ease-in-out infinite}
.lotus{animation:bloom 10s ease-in-out infinite;will-change:transform}
@keyframes breathe{0%,100%{transform:scale(.5);opacity:.15}50%{transform:scale(1.25);opacity:1}}

.lotus .pl1{animation:openL1 10s ease-in-out infinite}.lotus .pr1{animation:openR1 10s ease-in-out infinite}
.lotus .pl2{animation:openL2 10s ease-in-out infinite}.lotus .pr2{animation:openR2 10s ease-in-out infinite}
@keyframes openL1{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-14deg)}}
@keyframes openR1{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}

.playing .breath .in{animation:cueIn 10s ease-in-out infinite}
.playing .breath .out{animation:cueOut 10s ease-in-out infinite}
@keyframes cueIn{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes cueOut{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.breath small{font-size:.82rem;color:var(--ink-soft);letter-spacing:.03em}
.intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 -6px}
.intro h2{font-size:2.1rem}

.fold.open .fold-h svg{transform:rotate(180deg)}
.fold-b{display:none;flex-direction:column;gap:12px;padding:0 20px 22px}
.fold.open .fold-b{display:flex}

.snd.on .ic{background:var(--rose);color:#5E2338}
.snd label{font-weight:600;font-size:.97rem}
input[type=range]{width:100%;min-width:0;accent-color:var(--rose-deep);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .97rem var(--sans);background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:99px;min-height:42px;padding:0 16px;cursor:pointer;font-variant-numeric:tabular-nums}

/* ---------- audio ---------- */
const LEN={wind:86,fire:72,birds:77,forest:26.571,river:18.473,ocean:65.608,crickets:36.384},PAD=.15;
const loading={};
async function loadBuf(k){const r=await fetch("snd/"+k+".mp3");return ctx.decodeAudioData(await r.arrayBuffer())}
function build(){
  const AC=window.AudioContext||window.webkitAudioContext;try{ctx=new AC({latencyHint:"playback"})}catch(e){ctx=new AC()}
  master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  const merge=ctx.createChannelMerger(2);const tg=ctx.createGain();tg.gain.value=0;merge.connect(tg).connect(master);
  /* each ear gets its own tone and its own soft overtone; the right ear is shifted by the beat, overtone included,
     so both layers pulse at the same rate instead of fighting each other */
  const ear=ch=>{const o=ctx.createOscillator(),h=ctx.createOscillator(),hg=ctx.createGain(),g=ctx.createGain();
    hg.gain.value=.22;o.connect(g);h.connect(hg).connect(g);g.connect(merge,0,ch);o.start();h.start();return{o,h,hg}};
  nodes.tone=tg;nodes.E=[ear(0),ear(1)];nodes.cur=null;
  nodes.bowl=ctx.createGain();nodes.bowl.gain.value=0;nodes.bowl.connect(master);
  nodes.music=ctx.createGain();nodes.music.gain.value=0;nodes.music.connect(master);
  SOUNDS.forEach(k=>{const g=ctx.createGain();g.gain.value=0;g.connect(master);nodes[k]=g;});
}
/* a sound is downloaded and decoded only the first time someone turns it up */
function ensure(k){
  if(!ctx||st.vol[k]<=0)return Promise.resolve();
  if(!loading[k])loading[k]=loadBuf(k).then(b=>{const src=ctx.createBufferSource();src.buffer=b;src.loop=true;
    src.loopStart=PAD;src.loopEnd=Math.min(b.duration,PAD+LEN[k]);src.connect(nodes[k]);src.start(0,PAD+Math.random()*LEN[k]*.5);})
    .catch(()=>{delete loading[k]});
  return loading[k];}
/* one music track at a time: the old one fades out, the new one starts from its beginning */
const musicBufs={};let musicSrc=null,musicKey="";
function loadMusic(k){
  if(!musicBufs[k])musicBufs[k]=fetch("snd/musica-"+k+".mp3?v=2").then(r=>r.arrayBuffer()).then(a=>ctx.decodeAudioData(a)).catch(()=>{delete musicBufs[k]});
  return musicBufs[k];}
async function syncMusic(){
  if(!ctx)return;const want=playing?st.music:"";if(want===musicKey)return;
  if(musicSrc){const old=musicSrc,og=old._g,t=ctx.currentTime;og.gain.setTargetAtTime(0,t,.8);setTimeout(()=>{try{old.stop()}catch(e){}},4000);musicSrc=null}
  musicKey=want;if(!want)return;
  const b=await loadMusic(want);if(!b||musicKey!==want)return;
  const s=ctx.createBufferSource(),g=ctx.createGain(),[ls,le,from]=MLOOP[want];s.buffer=b;s.loop=true;s.loopStart=ls;s.loopEnd=Math.min(le,b.duration);
  g.gain.value=0;s.connect(g).connect(nodes.music);s._g=g;s.start(0,from);g.gain.setTargetAtTime(MGAIN[want],ctx.currentTime,1);musicSrc=s;}
function applyAudio(ramp=.6){
  if(!ctx)return;const now=ctx.currentTime;
  nodes.bowl.gain.setTargetAtTime(Math.pow(st.bvol/100,1.4)*.9,now,ramp);
  nodes.music.gain.setTargetAtTime(Math.pow(st.mvol/100,1.6)*.7,now,ramp);
  for(const k of SOUNDS)if(nodes[k])nodes[k].gain.setTargetAtTime(Math.pow(st.vol[k]/100,1.6),now,ramp);
  const f=st.freq,b=st.beat,key=f+"/"+b,level=f?Math.pow(st.fvol/100,2)*.09:0,tg=nodes.tone.gain;
  const tune=t=>{const base=f||100,[L,R]=nodes.E,hv=f&&f<300?.22:.06;
    L.o.frequency.setValueAtTime(base,t);L.h.frequency.setValueAtTime(base*2,t);
    R.o.frequency.setValueAtTime(base+b,t);R.h.frequency.setValueAtTime(base*2+b,t);
    L.hg.gain.setValueAtTime(hv,t);R.hg.gain.setValueAtTime(hv,t);};
  tg.cancelScheduledValues(now);
  if(nodes.cur===null||!playing){tune(now);tg.setTargetAtTime(level,now,ramp);}
  else if(key!==nodes.cur){                       /* a soft fade between tones, never a sliding siren */
    tg.setValueAtTime(tg.value,now);tg.setTargetAtTime(0,now,.08);tune(now+.4);tg.setTargetAtTime(level,now+.42,.35);}
  else tg.setTargetAtTime(level,now,ramp);
  nodes.cur=key;}

/* ---------- bell + timer ---------- */
function bell(){
  const t=ctx.currentTime;[[216,1],[432,.5],[596,.3],[1166,.15]].forEach(([f,a])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22*a,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+9);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+9.2);});}
function fmt(s){const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+String(r).padStart(2,"0")}
function updStatus(){
  const el=document.getElementById("status");
  if(!playing){el.textContent=el.dataset.ended?T[lang].ended:"";return}
  el.textContent=endAt?T[lang].left+" "+fmt(Math.max(0,(endAt-Date.now())/1000)):T[lang].ready;}
function finish(){
  bell();master.gain.setTargetAtTime(0,ctx.currentTime+1.5,2.5);
  setTimeout(()=>{stop(true)},9000);clearInterval(tick);endAt=0;}

async function start(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(!ctx)build();await ctx.resume();
  const el=document.getElementById("status");el.textContent="…";await Promise.all([...SOUNDS.map(ensure),st.music?loadMusic(st.music):0]);playing=true;applyAudio(.01);syncMusic();nextBowl=ctx.currentTime+2;st.bowls.forEach(loadBowl);
  master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(1,ctx.currentTime,1.2);
  document.getElementById("app").classList.add("playing");document.getElementById("status").dataset.ended="";
  const mins=TIMES[st.timer];endAt=mins?Date.now()+mins*60000:0;
  clearInterval(tick);tick=setInterval(()=>{updStatus();if(endAt&&Date.now()>=endAt)finish()},500);
  try{lock=await navigator.wakeLock?.request("screen")}catch(e){}
  render();}
function stop(ended){
  playing=false;clearInterval(tick);endAt=0;if(voice)voice.pause();
  if(ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.4);
  setTimeout(()=>{if(!playing)syncMusic()},1500);
  document.getElementById("app").classList.remove("playing");
  document.getElementById("status").dataset.ended=ended?"1":"";
  try{lock&&lock.release()}catch(e){}lock=null;render();}

/* ---------- UI ---------- */
function loadBowl(n){
  if(!bowlBufs[n])bowlBufs[n]=fetch("snd/cuenco-"+n+".mp3").then(r=>r.arrayBuffer()).then(a=>ctx.decodeAudioData(a)).catch(()=>{delete bowlBufs[n]});
  return bowlBufs[n];}
async function strike(n,soft){
  if(!ctx)return;const b=await loadBowl(n);if(!b)return;
  const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=b;g.gain.value=soft?.5+Math.random()*.35:.85;s.connect(g);
  if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=Math.random()*.8-.4;g.connect(p).connect(nodes.bowl)}else g.connect(nodes.bowl);
  s.start();}
setInterval(()=>{if(!playing||!ctx||!st.bowls.length)return;
  if(ctx.currentTime>=nextBowl){strike(st.bowls[Math.floor(Math.random()*st.bowls.length)],true);nextBowl=ctx.currentTime+9+Math.random()*7}},500);
function syncInputs(){SOUNDS.forEach(k=>{document.getElementById("v-"+k).value=st.vol[k]});document.getElementById("timer").value=st.timer;
  document.getElementById("freqVol").value=st.fvol;document.getElementById("musicVol").value=st.mvol;document.getElementById("voiceVol").value=st.vvol;}

function save(){try{localStorage.setItem("mc-state",JSON.stringify({vol:st.vol,freq:st.freq,fvol:st.fvol,beat:st.beat,timer:st.timer,vvol:st.vvol,music:st.music,mvol:st.mvol,preset}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem("mc-state")||"null");if(!d)return;
  SOUNDS.forEach(k=>{if(typeof d.vol?.[k]==="number")st.vol[k]=d.vol[k]});
  if(d.freq===0||FREQS.includes(d.freq))st.freq=d.freq;if(BINS.some(b=>b[1]===d.beat))st.beat=d.beat;
  ["fvol","timer","vvol","mvol"].forEach(k=>{if(typeof d[k]==="number")st[k]=d[k]});
  if(d.music===""||MUSIC.includes(d.music))st.music=d.music;if(typeof d.preset==="number")preset=d.preset;}catch(e){}}
/* a short welcome in Katiana's voice, only when someone chooses to hear it */

  document.getElementById("meds").innerHTML=t.m.map(([h,p],i)=>{const has=MEDS[lang]&&MEDS[lang][i],on=voice&&voiceIdx===i&&!voice.paused;
    return `<div class="med"><h3>${h}</h3><p>${p}</p>${has?`<button data-med="${i}">${on?t.stopV:t.listen}</button><span class="time" id="vt-${i}"></span>`:`<span class="soon">${t.soon}</span>`}</div>`}).join("");
  document.querySelectorAll("#presets .preset").forEach((b,i)=>{b.innerHTML="<b>"+t.P[i][0]+"</b><span>"+t.P[i][1]+"</span>";b.setAttribute("aria-pressed",i===preset)});
  summaries(t);welcomeUI(t);save();updStatus();}

document.getElementById("sounds").innerHTML=SOUNDS.map(k=>`<div class="snd" id="c-${k}">
  <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg></span>
  <label id="lbl-${k}" for="v-${k}"></label>
  <input type="range" id="v-${k}" min="0" max="100" value="${st.vol[k]}"></div>`).join("");
SOUNDS.forEach(k=>document.getElementById("v-"+k).addEventListener("input",e=>{st.vol[k]=+e.target.value;ensure(k);applyAudio();document.getElementById("c-"+k).classList.toggle("on",st.vol[k]>0)}));
document.getElementById("freqs").innerHTML=[0,...FREQS].map(f=>`<button class="chip" data-f="${f}"></button>`).join("");
document.getElementById("freqs").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.freq=+b.dataset.f;applyAudio();render()});
document.getElementById("music").innerHTML=["",...MUSIC].map(k=>`<button class="chip" type="button" data-m="${k}"></button>`).join("");
document.getElementById("music").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.music=b.dataset.m;if(st.music&&ctx)loadMusic(st.music);syncMusic();render()});
document.getElementById("musicVol").addEventListener("input",e=>{st.mvol=+e.target.value;applyAudio()});
document.getElementById("bins").innerHTML=BINS.map(([k,b])=>`<button class="chip" data-k="${k}" data-b="${b}"></button>`).join("");
document.getElementById("bins").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.beat=+b.dataset.b;applyAudio();render()});
document.getElementById("freqVol").addEventListener("input",e=>{st.fvol=+e.target.value;applyAudio()});
document.getElementById("timer").addEventListener("input",e=>{st.timer=+e.target.value;
  if(playing){const m=TIMES[st.timer];endAt=m?Date.now()+m*60000:0}render()});
document.getElementById("play").addEventListener("click",()=>playing?stop(false):start());
function vtime(){if(!voice)return;const e=document.getElementById("vt-"+voiceIdx);if(e)e.textContent=fmt(voice.currentTime)+" / "+(isFinite(voice.duration)?fmt(voice.duration):"…")}
document.getElementById("meds").addEventListener("click",async e=>{const b=e.target.closest("[data-med]");if(!b)return;const i=+b.dataset.med;
  if(voice&&voiceIdx===i&&!voice.paused){voice.pause();render();return}
  if(voice){voice.pause()}
  if(!playing)await start();
  voice=new Audio(MEDS[lang][i]);voiceIdx=i;
  try{const src=ctx.createMediaElementSource(voice),g=ctx.createGain();g.gain.value=st.vvol/100;src.connect(g).connect(master);nodes.voice=g}catch(err){nodes.voice=null;voice.volume=st.vvol/100}
  voice.addEventListener("timeupdate",vtime);voice.addEventListener("ended",()=>render());
  await voice.play();render();vtime();});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;try{localStorage.setItem("mc-lang",lang)}catch(e){}try{history.replaceState(null,"",lang==="fr"?location.pathname:"#"+lang)}catch(e){}render()}));
document.getElementById("presets").innerHTML=PRESETS.map((_,i)=>`<button class="preset" type="button" data-p="${i}"></button>`).join("");
document.getElementById("presets").addEventListener("click",async e=>{const b=e.target.closest(".preset");if(!b)return;const P=PRESETS[+b.dataset.p];
  preset=+b.dataset.p;st.music=P.music||"";SOUNDS.forEach(k=>st.vol[k]=P.vol[k]||0);st.freq=P.freq;st.fvol=P.fvol??35;st.beat=P.beat;st.bowls=P.bowls.slice();st.timer=P.timer;
  syncInputs();if(!playing){await start()}else{SOUNDS.forEach(ensure);st.bowls.forEach(loadBowl);applyAudio();const m=TIMES[st.timer];endAt=m?Date.now()+m*60000:0;nextBowl=ctx.currentTime+1.5;syncMusic()}
  render();});
document.getElementById("voiceVol").addEventListener("input",e=>{st.vvol=+e.target.value;const v=st.vvol/100;
  if(nodes.voice&&ctx)nodes.voice.gain.setTargetAtTime(v,ctx.currentTime,.1);else if(voice)voice.volume=v;});
["sounds","freqs","bins","music"].forEach(id=>document.getElementById(id).addEventListener(id==="sounds"?"input":"click",()=>{if(preset>=0){preset=-1;render()}}));
/* sections open and close; each stays as the visitor left it */
let openSet=[];try{openSet=JSON.parse(localStorage.getItem("mc-open")||"[]")}catch(e){}
document.querySelectorAll(".fold").forEach(f=>{const k=f.dataset.fold,b=f.querySelector(".fold-h");
  const set=o=>{f.classList.toggle("open",o);b.setAttribute("aria-expanded",o)};set(openSet.includes(k));
  b.addEventListener("click",()=>{const o=!f.classList.contains("open");set(o);openSet=openSet.filter(x=>x!==k);if(o)openSet.push(k);try{localStorage.setItem("mc-open",JSON.stringify(openSet))}catch(e){}})});
document.getElementById("app").addEventListener("input",()=>{summaries(T[lang]);save()});
restore();syncInputs();render();

window.addEventListener("hashchange",()=>{const l=location.hash.slice(1);if(T[l]&&l!==lang){lang=l;render()}});
</script>
</body>
</html>
